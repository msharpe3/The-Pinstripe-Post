# Deploys the alert service (worker/) to Cloudflare, then saves its address in config.js for the site.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy alerts service

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-alerts.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: deploy-alerts
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi

      - name: Deploy to Cloudflare
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          # Retry, since npm occasionally lists a new release before its download is ready.
          for attempt in 1 2 3; do
            npx --yes wrangler@4 deploy > deploy.log 2>&1
            code=$?
            if [ "$code" -eq 0 ] || ! grep -q "npm error" deploy.log; then break; fi
            echo "npm download problem (attempt $attempt), retrying in 30 seconds..."
            npm cache clean --force > /dev/null 2>&1
            sleep 30
          done
          cat deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ "$code" -ne 0 ] || [ -z "$url" ]; then
            # Put Cloudflare's error lines on the run summary page so they're easy to find.
            sed 's/\x1b\[[0-9;]*m//g' deploy.log | grep -iE 'error|✘|subdomain|authentication|permission|not found|code: ' | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::Cloudflare deploy didn't finish (exit code $code). Full output is in the 'Deploy to Cloudflare' step."
            exit 1
          fi
          echo "::notice::Alert service is live at $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Save the service address for the site
        if: steps.deploy.outputs.url != ''
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '// Address of the alert service. Filled in automatically when the service is deployed.\nwindow.PP_ALERTS_URL = "%s";\n' "$URL" > config.js
          if git diff --quiet config.js; then
            echo "config.js already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add config.js
          git commit -m "Connect alerts to $URL"
          git push
          # Pushes made by this workflow don't trigger a Pages build on their own, so request one.
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
